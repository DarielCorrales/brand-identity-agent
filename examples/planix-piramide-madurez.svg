<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planix — Pirámide de madurez en compras (base → cima)" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <title>Planix — Pirámide de madurez 3-2-1</title>
  <desc>Framework de diagnóstico: base (Política de Compras, Manuales de Procedimientos, Planificación) → centro (Procesos Competitivos, Medición y Mejora) → cima (Expansión).</desc>

  <!-- Fondo hueso -->
  <rect width="680" height="460" fill="#F5F1EA"/>

  <!-- Triángulo guía (cue de pirámide) -->
  <polygon points="190,74 62,364 318,364" fill="#B8935B" fill-opacity="0.10"/>

  <!-- Eje de madurez -->
  <g stroke="#24242A" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="24" y1="372" x2="24" y2="96"/>
    <path d="M18 108 L24 94 L30 108"/>
  </g>
  <text x="16" y="234" font-size="10" letter-spacing="2" fill="#24242A" fill-opacity="0.5" transform="rotate(-90 16 234)" text-anchor="middle">MADUREZ</text>

  <!-- ===== NODOS (grafito) + apex en oro champán ===== -->
  <g fill="#24242A">
    <!-- Conectores base -->
    <g>
      <rect x="70"  y="349" width="60" height="14" rx="7"/>
      <rect x="130" y="349" width="60" height="14" rx="7"/>
      <rect x="190" y="349" width="60" height="14" rx="7"/>
      <rect x="250" y="349" width="60" height="14" rx="7"/>
    </g>
    <!-- Beads base (5): x = 70,130,190,250,310 -->
    <circle cx="70"  cy="356" r="15"/>
    <circle cx="130" cy="356" r="15"/>
    <circle cx="190" cy="356" r="15"/>
    <circle cx="250" cy="356" r="15"/>
    <circle cx="310" cy="356" r="15"/>

    <!-- Conectores centro -->
    <g>
      <rect x="130" y="217" width="60" height="14" rx="7"/>
      <rect x="190" y="217" width="60" height="14" rx="7"/>
    </g>
    <!-- Beads centro (3): x = 130,190,250 -->
    <circle cx="130" cy="224" r="15"/>
    <circle cx="190" cy="224" r="15"/>
    <circle cx="250" cy="224" r="15"/>

    <!-- Gota superior (guiño al isotipo) -->
    <circle cx="190" cy="62" r="7"/>
  </g>

  <!-- Apex (cima) en oro champán: la meta -->
  <circle cx="190" cy="92" r="16" fill="#B8935B"/>

  <!-- ===== ETIQUETAS ===== -->
  <g fill="#24242A">
    <!-- CIMA -->
    <text x="352" y="86"  font-size="10" letter-spacing="2" fill="#B8935B">CIMA</text>
    <text x="352" y="108" font-size="22" font-weight="600" fill="#14213D">Expansión</text>
    <text x="352" y="126" font-size="11" fill-opacity="0.6">Escalar el modelo a nuevos frentes</text>

    <!-- CENTRO -->
    <text x="352" y="206" font-size="10" letter-spacing="2" fill="#B8935B">CENTRO</text>
    <text x="352" y="228" font-size="16" font-weight="500">Procesos Competitivos</text>
    <text x="352" y="250" font-size="16" font-weight="500">Medición y Mejora</text>

    <!-- BASE -->
    <text x="352" y="330" font-size="10" letter-spacing="2" fill="#B8935B">BASE</text>
    <text x="352" y="352" font-size="14" font-weight="500">Política de Compras</text>
    <text x="352" y="372" font-size="14" font-weight="500">Manuales de Procedimientos</text>
    <text x="352" y="392" font-size="14" font-weight="500">Planificación</text>
  </g>

  <!-- Pie -->
  <text x="26" y="440" font-size="11" fill="#24242A" fill-opacity="0.55">Planix · Pirámide de madurez en compras</text>
</svg>
